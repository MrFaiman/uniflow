syntax = "proto3";

package ipc;
option go_package = "github.com/MrFaiman/uniflow/pb";

message IPCRequest {
  string command = 1;
  bytes data = 2;
  string target_ip = 3;
  uint64 object_id = 4;
  bool coordinated = 5;
  string relative_path = 6;
  string dest_relative_path = 7;
  bool is_directory = 8;
}

message IPCResponse {
  bool success = 1;
  string message = 2;
}