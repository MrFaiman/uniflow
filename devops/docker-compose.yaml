services:
  router:
    profiles:
      - all
      - tx

    build:
      context: .
      dockerfile: router/Dockerfile

    environment:
      PORT: "9000"
      UNIFLOW_WORKERS: "3"

      RX_HOST: "${RX_HOST:-rx_machine}"

      PACKET_LOSS: "${PACKET_LOSS:-0.03}"
      BIT_FLIP: "${BIT_FLIP:-0.03}"
      MISROUTING: "${MISROUTING:-0.03}"

      STATS_INTERVAL_SEC: "${STATS_INTERVAL_SEC:-10}"
      LOG_PACKETS: "${LOG_PACKETS:-0}"
      RANDOM_SEED: "${RANDOM_SEED:-1337}"

    networks:
      - uniflow_net

  rx_machine:
    profiles:
      - all
      - rx

    build:
      context: ..
      dockerfile: devops/uniflow.Dockerfile

    hostname: rx_machine

    command:
      - receive
      - /data/in

    environment:
      PORT: "9000"
      UNIFLOW_WORKERS: "3"

      IPC_SOCKET_PATH: /tmp/proto_ipc.sock
      UNIFLOW_NET_BINARY: /usr/local/bin/uniflow-net

      RECEIVE_DIR: /data/in

    volumes:
      - ./data/in:/data/in

    ports:
      - "9000:9000/udp"
      - "9001:9001/udp"
      - "9002:9002/udp"

    networks:
      - uniflow_net

  tx_machine:
    profiles:
      - all
      - tx
      - tx-external

    build:
      context: ..
      dockerfile: devops/uniflow.Dockerfile

    command:
      - send
      - /data/out
      - "${ROUTER_HOST:-router}"

    environment:
      PORT: "9000"
      UNIFLOW_WORKERS: "3"

      IPC_SOCKET_PATH: /tmp/proto_ipc.sock
      UNIFLOW_NET_BINARY: /usr/local/bin/uniflow-net

      UNIFLOW_WATCH_POLLING: "1.0"
      UNIFLOW_MAX_FILE_BYTES: "1073741824"

      # TX sees the same configured destructive faults as the bundled router.
      # If UNIFLOW_FEC_REPAIR_PERCENT is not explicitly supplied, Python
      # automatically chooses a repair percentage from loss + bit-flip rates.
      PACKET_LOSS: "${PACKET_LOSS:-0.03}"
      BIT_FLIP: "${BIT_FLIP:-0.03}"
      UNIFLOW_FEC_REPAIR_PERCENT: "${UNIFLOW_FEC_REPAIR_PERCENT:-}"

      # Conservative physical-PC default.
      # Three Senders -> roughly 24 Mbps aggregate before FEC.
      UNIFLOW_SEND_RATE_MBPS: "${UNIFLOW_SEND_RATE_MBPS:-8}"

    volumes:
      - ./data/out:/data/out

    networks:
      - uniflow_net

networks:
  uniflow_net:
    driver: bridge
