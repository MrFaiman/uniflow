services:
  router:
    profiles:
      - all
      - tx
    build:
      context: .
      dockerfile: router/Dockerfile
    init: true
    stop_grace_period: 10s
    environment:
      PORT: "9000"
      UNIFLOW_WORKERS: "3"
      # In all-in-one mode this defaults to the RX Docker container.
      # In two-PC mode set RX_HOST to the physical RX computer IP.
      RX_HOST: "${RX_HOST:-rx_machine}"
      PACKET_LOSS: "${PACKET_LOSS:-0.03}"
      BIT_FLIP: "${BIT_FLIP:-0.03}"
      MISROUTING: "${MISROUTING:-0.03}"
      STATS_INTERVAL_SEC: "${STATS_INTERVAL_SEC:-10}"
      LOG_PACKETS: "${LOG_PACKETS:-0}"
      RANDOM_SEED: "${RANDOM_SEED:-1337}"
    networks:
      - uniflow_net
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py", "router"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      rx_machine:
        condition: service_healthy
        required: false

  rx_machine:
    profiles:
      - all
      - rx
    build:
      context: ..
      dockerfile: devops/uniflow.Dockerfile
    hostname: rx_machine
    init: true
    stop_grace_period: 15s
    command:
      - receive
      - /data/in
    environment:
      PORT: "9000"
      UNIFLOW_WORKERS: "3"
      IPC_SOCKET_PATH: /tmp/proto_ipc.sock
      UNIFLOW_NET_BINARY: /usr/local/bin/uniflow-net
      UNIFLOW_LOG_FILE: /var/log/uniflow/rx.log
      RECEIVE_DIR: /data/in
    volumes:
      - ${UNIFLOW_TEST_IN_DIR:-./data/in}:/data/in
    # These must be published so another physical PC can reach the RX Receivers.
    ports:
      - "9000:9000/udp"
      - "9001:9001/udp"
      - "9002:9002/udp"
    networks:
      - uniflow_net
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "/app/healthcheck.py",
          "receive",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

  tx_machine:
    profiles:
      - all
      - tx
      - tx-external
    build:
      context: ..
      dockerfile: devops/uniflow.Dockerfile
    init: true
    stop_grace_period: 15s
    # Normally ROUTER_HOST defaults to our Docker router.
    # With profile tx-external you can provide the IP of a real/instructor router instead.
    command:
      - send
      - /data/out
      - "${ROUTER_HOST:-router}"
    environment:
      PORT: "9000"
      UNIFLOW_WORKERS: "3"
      IPC_SOCKET_PATH: /tmp/proto_ipc.sock
      UNIFLOW_NET_BINARY: /usr/local/bin/uniflow-net
      UNIFLOW_LOG_FILE: /var/log/uniflow/tx.log
      UNIFLOW_WATCH_POLLING: "${UNIFLOW_WATCH_POLLING:-1.0}"
      UNIFLOW_MAX_FILE_BYTES: "${UNIFLOW_MAX_FILE_BYTES:-1073741824}"
      UNIFLOW_FEC_REPAIR_PERCENT: "${UNIFLOW_FEC_REPAIR_PERCENT:-50}"
      UNIFLOW_SEND_RATE_MBPS: "${UNIFLOW_SEND_RATE_MBPS:-1}"
    volumes:
      - ${UNIFLOW_TEST_OUT_DIR:-./data/out}:/data/out
    networks:
      - uniflow_net
    depends_on:
      router:
        condition: service_healthy
        required: false
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "/app/healthcheck.py",
          "send",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

networks:
  uniflow_net:
    driver: bridge
