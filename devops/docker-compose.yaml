services:
  router:
    build:
      context: .
      dockerfile: router/Dockerfile
    environment:
      PORT: "9000"
      UNIFLOW_WORKERS: "3"
      UNIFLOW_SKIP_BUILD: "1"
      IPC_SOCKET_PATH: /tmp/proto_ipc.sock
      PACKET_LOSS: "0.03"
      BIT_FLIP: "0.03"
      MISROUTING: "0.03"
      STATS_INTERVAL_SEC: "10"
    networks:
      - uniflow_net
    depends_on:
      - rx_machine

  rx_machine:
    build:
      context: ..
      dockerfile: devops/uniflow.Dockerfile
    hostname: rx_machine
    command: [ "receive", "/data/in", "router" ]
    environment:
      PORT: "9000"
      UNIFLOW_WORKERS: "3"
      UNIFLOW_SKIP_BUILD: "1"
      IPC_SOCKET_PATH: /tmp/proto_ipc.sock
      RECEIVE_DIR: /data/in
    volumes:
      - ./data/in:/data/in
    networks:
      - uniflow_net
    expose:
      - "9000/udp"
      - "9001/udp"
      - "9002/udp"

  tx_machine:
    build:
      context: ..
      dockerfile: devops/uniflow.Dockerfile
    command: [ "send", "/data/out", "router" ]
    environment:
      PORT: "9000"
      UNIFLOW_WORKERS: "3"
      UNIFLOW_SKIP_BUILD: "1"
      IPC_SOCKET_PATH: /tmp/proto_ipc.sock
      UNIFLOW_WATCH_POLLING: "1"
    volumes:
      - ./data/out:/data/out
    networks:
      - uniflow_net
    depends_on:
      - router
      - rx_machine

networks:
  uniflow_net:
    driver: bridge
