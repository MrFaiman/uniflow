name: C++ CI

on:
  workflow_call:
    inputs:
      uv-version:
        description: uv version used by CI
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "4"

jobs:
  cpp-build:
    name: C++ (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc14
            compiler: g++-14
            package: g++-14
          - name: clang19
            compiler: clang++-19
            package: clang-19
    env:
      CXX: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        env:
          COMPILER_PACKAGE: ${{ matrix.package }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "$COMPILER_PACKAGE" cmake ninja-build libprotobuf-dev protobuf-compiler

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: uniflow-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}
          max-size: 500M

      - name: Cache FetchContent dependencies
        uses: actions/cache@v6.1.0
        with:
          path: cpp/build/_deps
          key: fetchcontent-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}-${{ hashFiles('cpp/cmake/Dependencies.cmake') }}

      - name: Configure
        run: |
          cmake -S cpp -B cpp/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DUNIFLOW_BUILD_TESTS=ON

      - name: Build
        run: cmake --build cpp/build

      - name: CTest
        run: |
          mkdir -p reports
          ctest --test-dir cpp/build --output-on-failure --parallel 4 \
            --output-junit "$GITHUB_WORKSPACE/reports/ctest.xml"

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ inputs.uv-version }}
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: python/client/uv.lock
          cache-suffix: ${{ matrix.name }}

      - name: Test compiled workers and supervisor lifecycle
        working-directory: python/client
        env:
          UNIFLOW_NET_BINARY: ${{ github.workspace }}/cpp/build/uniflow-net
        run: uv run --frozen pytest -q tests/test_workers.py tests/test_worker_cli.py --junitxml=../../reports/workers.xml

      - name: Package uniflow-net
        run: |
          mkdir -p dist
          cp cpp/build/uniflow-net dist/uniflow-net
          "$CXX" --version > dist/compiler.txt
          ldd dist/uniflow-net > dist/libraries.txt
          ./dist/uniflow-net --help > dist/help.txt

      - name: Upload uniflow-net artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: uniflow-net-linux-${{ runner.arch }}-${{ matrix.name }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Generate C++ coverage report
        if: matrix.name == 'gcc14'
        run: |
          cmake -S cpp -B cpp/build-coverage -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DUNIFLOW_BUILD_TESTS=ON \
            -DUNIFLOW_ENABLE_COVERAGE=ON \
            -DUNIFLOW_GCOV_EXECUTABLE=gcov-14 \
            -DUNIFLOW_COVERAGE_MIN_LINES=80 \
            -DFETCHCONTENT_SOURCE_DIR_ARGPARSE="$GITHUB_WORKSPACE/cpp/build/_deps/argparse-src" \
            -DFETCHCONTENT_SOURCE_DIR_CATCH2="$GITHUB_WORKSPACE/cpp/build/_deps/catch2-src"
          cmake --build cpp/build-coverage --target coverage

      - name: Upload C++ coverage report
        if: always() && matrix.name == 'gcc14'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cpp-coverage-${{ matrix.name }}
          path: cpp/build-coverage/coverage/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload C++ test reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cpp-reports-${{ matrix.name }}
          path: |
            reports/
            cpp/build/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7
