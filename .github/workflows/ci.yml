name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpp-build:
    name: C++ Sender/Receiver build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libprotobuf-dev protobuf-compiler
      - name: Configure
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build cpp/build --parallel

  python-tests:
    name: Python File Monitor / Session Manager
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "35.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Python Protobuf
        run: bash scripts/generate-proto.sh python
      - name: Install dependencies
        working-directory: python/client
        run: uv sync --all-groups
      - name: Ruff
        working-directory: python/client
        run: uv run ruff check src tests
      - name: Pytest
        working-directory: python/client
        run: uv run pytest

  devops-tests:
    name: DevOps helper tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Test fixture helpers
        run: python -m pytest devops/scripts/test_transfer_fixtures.py
