name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  go-tests:
    name: Go tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      - name: Run Go tests
        working-directory: ./go
        run: go test ./...

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python dependencies
        working-directory: ./python/client
        run: uv sync --dev

      - name: Run Python lint and tests
        working-directory: ./python/client
        run: |
          uv run ruff check .
          if find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) | grep -q .; then
            uv run pytest
          else
            echo "No Python tests found; skipping pytest."
          fi
