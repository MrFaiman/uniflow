[project]
name = "uniflow"
version = "0.1.0"
description = "Uniflow FLUTE file transfer client"
readme = "README.md"
authors = [
    { name = "Roey", email = "roeyfaiman@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "protobuf>=7.36.1",
    "python-dotenv>=1.2.3",
    "watchdog>=6.0.0",
]

[project.scripts]
uniflow = "uniflow.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 80
target-version = "py313"
extend-exclude = ["*_pb2.py", "*_pb2.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.16.5",
]
