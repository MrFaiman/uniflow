[project]
name = "client"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Roey", email = "roeyfaiman@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "grpcio-tools>=1.83.1",
    "protobuf>=7.36.1",
    "raptorq>=2.0.0",
]

[project.scripts]
client = "client:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 80
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.16.5",
]

[tool.ruff.lint.per-file-ignores]
"src/client/*_pb2.py" = ["ALL"]
