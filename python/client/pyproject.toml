[project]
name = "uniflow-client"
version = "0.1.0"
description = "Python File Monitor and Session Manager for Uniflow"
requires-python = ">=3.13"
dependencies = [
    "protobuf>=7.35.1,<8",
    "raptorq==2.0.0",
]

[project.scripts]
uniflow = "client.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["*_pb2.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.16",
]
